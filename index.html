<style>
/* ==== tokens ==== */
:root{
  --bg:#f5f6f8;--surface:#ffffff;--surface-2:#f0f2f5;--surface-3:#e6e9ee;--border:#dfe3e9;--text:#1a1f29;--muted:#5b6474;
  --accent:#3b5bdb;--accent-contrast:#ffffff;--accent-soft:#e8edfc;--danger:#c92a2a;--danger-soft:#fde8e8;--warn:#a85d00;--warn-soft:#fff3db;--ok:#2b8a3e;--ok-soft:#e3f5e7;
  --chip:#eef0f4;--chip-text:#3b4352;--shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.06);--shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --focus:0 0 0 3px rgba(59,91,219,.3);--backdrop:rgba(15,20,30,.42);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218;--surface:#171b23;--surface-2:#1e232d;--surface-3:#272d39;--border:#2b3240;--text:#e6e9ef;--muted:#99a2b3;
    --accent:#7b94ff;--accent-contrast:#0d1020;--accent-soft:#232b48;--danger:#ff7b7b;--danger-soft:#3a1d22;--warn:#f0b357;--warn-soft:#3a2c14;--ok:#6fd38a;--ok-soft:#173222;
    --chip:#252b37;--chip-text:#c9cfdb;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);--shadow-lg:0 12px 32px rgba(0,0,0,.55);
    --focus:0 0 0 3px rgba(123,148,255,.35);--backdrop:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218;--surface:#171b23;--surface-2:#1e232d;--surface-3:#272d39;--border:#2b3240;--text:#e6e9ef;--muted:#99a2b3;
  --accent:#7b94ff;--accent-contrast:#0d1020;--accent-soft:#232b48;--danger:#ff7b7b;--danger-soft:#3a1d22;--warn:#f0b357;--warn-soft:#3a2c14;--ok:#6fd38a;--ok-soft:#173222;
  --chip:#252b37;--chip-text:#c9cfdb;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);--shadow-lg:0 12px 32px rgba(0,0,0,.55);
  --focus:0 0 0 3px rgba(123,148,255,.35);--backdrop:rgba(0,0,0,.6);color-scheme:dark;
}
/* ==== base ==== */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{flex:none;display:block}
.muted{color:var(--muted)}.small{font-size:12px}.nowrap{white-space:nowrap}.grow{flex:1}.right{margin-left:auto}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ==== layout ==== */
.app{display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;margin-right:auto;white-space:nowrap;min-width:0}
.brand-logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-contrast);display:grid;place-items:center}
.sidenav{background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none}
.nav-link:hover{background:var(--surface-2)}
.nav-link[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-link kbd{margin-left:auto}
.nav-foot{margin-top:auto;padding:10px;font-size:11px;color:var(--muted)}
.content{display:flex;flex-direction:column;min-width:0;min-height:0}
#main{flex:1;overflow:auto;padding:20px 24px 32px;min-height:0;outline:none}
#main.board-mode{padding:0;overflow:hidden;display:flex;flex-direction:column}
.page-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:20px;margin:0 auto 0 0}
.backup-ind{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 6px;white-space:nowrap;background:none;border:0;cursor:pointer;height:34px;border-radius:8px}
.backup-ind:hover{background:var(--surface-2)}
.backup-ind .dot{width:8px;height:8px}
.badge-count{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:52px minmax(0,1fr) 60px}
  .topbar{padding:0 10px;gap:4px}
  .sidenav{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--border);padding:4px;gap:0;overflow:hidden}
  .nav-link{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:10px;justify-content:center;text-align:center;min-width:0}
  .nav-link span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-link kbd,.nav-foot,.hide-sm{display:none!important}
  #main{padding:14px 16px 24px}
  .brand span{display:none}
}
/* ==== controls ==== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--border);background:var(--surface);border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn kbd{background:transparent;border-color:currentColor;color:inherit;opacity:.7}
.icon-btn{position:relative;width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted);flex:none;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.sm{width:26px;height:26px;border-radius:6px}
.icon-btn.danger:hover{color:var(--danger)}
kbd{font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;padding:0 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--surface)}
.input{width:100%;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:0}
select.input{padding-right:6px}
textarea.input{height:auto;padding:8px 10px;resize:vertical;min-height:80px;line-height:1.5}
.input:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus)}
.input.sm{height:28px;font-size:13px}
.input.invalid{border-color:var(--danger)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field-label{font-size:12px;color:var(--muted);font-weight:500}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--danger)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 12px;height:32px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* ==== chips & pills ==== */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:var(--surface-2);font-size:12px;white-space:nowrap;border:1px solid var(--border)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--chip-text);font-size:12px;white-space:nowrap;max-width:100%}
.chip button{border:0;background:none;padding:0;cursor:pointer;color:inherit;opacity:.7;display:grid;place-items:center}
.chip button:hover{opacity:1}
.badge{font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;line-height:18px}
.prio{font-size:11px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.prio-3{color:var(--danger)}.prio-2{color:var(--warn)}.prio-1{color:var(--muted)}
.filter-chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.filter-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.stars{display:inline-flex;gap:1px}
.stars button{border:0;background:none;padding:2px;cursor:pointer;color:var(--surface-3)}
.stars button.on{color:#f5a524}
.stars button:hover{transform:scale(1.15)}
/* ==== banners ==== */
#banners:empty{display:none}
.banner{display:flex;align-items:center;gap:10px;padding:8px 24px;font-size:13px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--text)}
.banner.danger{background:var(--danger-soft)}
.banner.info{background:var(--accent-soft)}
.banner .grow{min-width:200px}
@media (max-width:760px){.banner{padding:8px 16px}}
/* ==== board ==== */
.board-toolbar{display:flex;gap:8px;align-items:center;padding:14px 24px 0;flex-wrap:wrap}
.board-toolbar .input{max-width:280px}
.board{flex:1;display:flex;gap:12px;overflow-x:auto;padding:12px 24px 16px;min-height:0}
.col{flex:0 0 276px;display:flex;flex-direction:column;background:var(--surface-2);border-radius:12px;min-height:0;border:2px solid transparent;transition:border-color .12s,background .12s}
.col.drop-over{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:8px;padding:10px 8px 8px 12px;font-weight:600;font-size:13px}
.col-count{color:var(--muted);font-weight:500}
.col-body{flex:1;overflow-y:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.col-empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 8px;border:1px dashed var(--border);border-radius:8px}
.col.collapsed{flex:0 0 52px;cursor:pointer}
.col.collapsed .col-head{writing-mode:vertical-rl;padding:12px 0;align-self:center;gap:10px}
.col.collapsed .col-body{display:none}
.card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--st,var(--border));border-radius:10px;padding:9px 10px 9px 11px;box-shadow:var(--shadow-sm);cursor:grab;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;gap:5px;flex:none}
.card:hover{box-shadow:var(--shadow)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card.dragging{opacity:.35}
.card-top{display:flex;align-items:center;gap:6px;min-width:0}
.card-company{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-pos{font-size:13px;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
.card-foot{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.due{display:inline-flex;align-items:center;gap:3px;margin-left:auto;white-space:nowrap}
.due.overdue{color:var(--danger);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.drag-ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;box-shadow:var(--shadow-lg);opacity:.96;rotate:1.5deg}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
.today-strip{margin:12px 24px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.today-strip h2{font-size:13px;margin:0;display:flex;align-items:center;gap:6px}
.today-list{display:flex;flex-direction:column;gap:4px;max-height:132px;overflow:auto}
.today-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;border-radius:6px;border:0;background:none;text-align:left;cursor:pointer;width:100%;color:inherit}
.today-item:hover{background:var(--surface-2)}
.today-item .when{font-size:12px;color:var(--muted);white-space:nowrap;min-width:88px}
.today-item.overdue .when{color:var(--danger);font-weight:600}
@media (max-width:760px){.board{padding:10px 16px 12px}.board-toolbar{padding:10px 16px 0}.today-strip{margin:10px 16px 0}.col{flex-basis:82vw}}
/* ==== table ==== */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters .input{width:auto}
.filters .q{width:240px}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);max-height:calc(100dvh - 250px);min-height:200px}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.data th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--muted);padding:0;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.data th>button,.data th>span{display:flex;align-items:center;gap:4px;width:100%;padding:9px 10px;background:none;border:0;cursor:pointer;color:inherit;font-weight:600;text-align:left}
.data th[aria-sort] button{color:var(--text)}
.data td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;max-width:280px}
.data tbody tr{cursor:pointer}
.data tbody tr:hover td{background:var(--surface-2)}
.data tbody tr.selected td{background:var(--accent-soft)}
.data tbody tr:last-child td{border-bottom:0}
.data .cb{width:36px;padding-left:12px}
.data .td-strong{font-weight:600}
.bulkbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-radius:10px;margin-bottom:10px;flex-wrap:wrap}
.table-foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
/* ==== drawer ==== */
.drawer-back{position:fixed;inset:0;background:var(--backdrop);z-index:50;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100vw);background:var(--surface);z-index:51;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .18s ease-out;outline:none}
.drawer-head{padding:12px 16px 0;border-bottom:1px solid var(--border)}
.drawer-top{display:flex;align-items:center;gap:6px}
.drawer-body{flex:1;overflow:auto;padding:16px 16px 32px}
.title-input{font-size:20px;font-weight:700;border:1px solid transparent;background:transparent;width:100%;padding:2px 6px;border-radius:6px;margin-left:-6px}
.title-input.sub{font-size:15px;font-weight:500;color:var(--muted)}
.title-input:hover{border-color:var(--border)}
.title-input:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:8px -4px 0;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 10px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.tab .n{font-size:11px;background:var(--surface-2);border-radius:999px;padding:0 6px;color:var(--muted)}
.saved-ind{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s;white-space:nowrap}
.saved-ind.show{opacity:1}
.status-btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.status-btn:hover{background:var(--surface-2)}
.quick-dates{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.section-title{font-size:13px;font-weight:600;margin:20px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.tag-editor{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:4px 6px;min-height:34px;background:var(--surface)}
.tag-editor:focus-within{border-color:var(--accent);box-shadow:var(--focus)}
.tag-editor input{border:0;outline:none;background:transparent;flex:1;min-width:100px;height:24px}
.md{line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere}
.md p{margin:0 0 8px}.md ul{margin:0 0 8px;padding-left:20px}
.md-box{border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:80px;background:var(--surface)}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 14px 34px}
.tl-icon{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:grid;place-items:center;color:var(--muted)}
.tl-item.status .tl-icon{border-color:var(--c)}
.tl-item.status .tl-icon::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tl-item.event .tl-icon{border-color:var(--accent);color:var(--accent)}
.tl-item.upcoming .tl-card{border-color:var(--accent)}
.tl-card{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface)}
.tl-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-title{font-weight:600}
.tl-when{font-size:12px;color:var(--muted)}
.tl-status-line{font-size:13px;padding-top:2px}
.list-rows{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.list-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);min-width:0}
.list-row+.list-row{border-top:1px solid var(--border)}
.list-row .main{flex:1;min-width:0}
.list-row.click{cursor:pointer}
.list-row.click:hover{background:var(--surface-2)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(40px);opacity:.4}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
/* ==== modal / menu / toast ==== */
.modal-back{position:fixed;inset:0;background:var(--backdrop);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 16px;overflow:auto;animation:fade .12s}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(500px,100%);display:flex;flex-direction:column;max-height:86vh;animation:pop .14s ease-out;outline:none}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:16px;margin:0;flex:1}
.modal-body{padding:16px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.menu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px;min-width:190px;max-height:70vh;overflow:auto;animation:pop .1s ease-out}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;white-space:nowrap}
.menu-item:hover,.menu-item:focus{background:var(--surface-2);outline:none}
.menu-item.danger{color:var(--danger)}
.menu-item .mark{margin-left:auto;color:var(--accent)}
.menu-sep{height:1px;background:var(--border);margin:4px 0}
.menu-label{font-size:11px;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.4px}
#toast-root{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(480px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);padding:10px 12px 10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;animation:pop .15s;max-width:100%}
.toast.error{background:var(--danger);color:#fff}
.toast .btn{background:transparent;color:inherit;border-color:currentColor;height:28px}
@media (max-width:760px){#toast-root{bottom:72px}}
/* ==== search ==== */
.search-input{font-size:16px;height:44px}
.results{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.result{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:inherit;width:100%}
.result[aria-selected="true"],.result:hover{background:var(--accent-soft)}
.result .snip{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
mark{background:#ffe066;color:#1a1f29;border-radius:2px;padding:0 1px}
/* ==== calendar ==== */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--border);gap:1px}
.cal-dow{background:var(--surface-2);padding:6px;font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cal-day{background:var(--surface);min-height:108px;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-day.other{background:var(--surface-2)}
.cal-day.other .cal-num{color:var(--muted)}
.cal-num{font-size:12px;align-self:flex-end;min-width:22px;height:22px;display:grid;place-items:center;border-radius:999px}
.cal-day.today .cal-num{background:var(--accent);color:var(--accent-contrast);font-weight:700}
.cal-item{font-size:11.5px;padding:1px 5px;border-radius:4px;border:0;border-left:3px solid var(--c,var(--accent));text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface-2);color:var(--text);width:100%;flex:none}
.cal-item:hover{background:var(--surface-3)}
.cal-item.done{opacity:.55;text-decoration:line-through}
.cal-more{font-size:11px;color:var(--muted);border:0;background:none;cursor:pointer;text-align:left;padding:0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.agenda-day{margin-bottom:16px}
.agenda-day h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
.agenda-day.today h3{color:var(--accent)}
@media (max-width:760px){.cal-day{min-height:58px;padding:2px}.cal-item{font-size:0;height:5px;padding:0;border-left:0;background:var(--c,var(--accent))}.cal-more{display:none}}
/* ==== stats ==== */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi-v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-l{color:var(--muted);font-size:12px}
.kpi-s{color:var(--muted);font-size:11px;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:14px;margin:0 0 4px}
.panel .sub{font-size:12px;color:var(--muted);margin:0 0 14px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:16px;margin-top:16px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hbar-track{height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar-fill{height:100%;background:var(--accent);border-radius:4px;min-width:2px}
.hbar-val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;min-width:64px;text-align:right}
.hbar-val small{color:var(--muted);font-weight:400}
.vbars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:18px;border-bottom:1px solid var(--border)}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.vbar-fill{width:100%;max-width:36px;background:var(--accent);border-radius:4px 4px 0 0}
.vbar-val{font-size:11px;font-weight:600;margin-bottom:3px;font-variant-numeric:tabular-nums}
.vbar-x{display:flex;gap:6px;margin-top:4px}
.vbar-x span{flex:1;text-align:center;font-size:10px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
/* ==== settings & docs ==== */
.settings{display:flex;flex-direction:column;gap:16px;max-width:860px}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.set-row:first-of-type{border-top:0}
.set-row .set-text{flex:1;min-width:220px}
.set-row .set-text b{display:block;font-weight:600}
.set-row .set-text span{font-size:12px;color:var(--muted)}
.dropzone{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:16px;background:var(--surface)}
.dropzone.over,.dropzone:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.empty{text-align:center;padding:48px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{color:var(--text);margin:0;font-size:16px}
.empty p{margin:0;max-width:420px}
.empty .i{color:var(--muted);opacity:.6}
.dup-warn{background:var(--warn-soft);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;font-size:13px}
.map-table{width:100%;border-collapse:collapse;font-size:13px}
.map-table td,.map-table th{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
.preview-wrap{overflow:auto;max-height:200px;border:1px solid var(--border);border-radius:8px;margin-top:12px}
.preview-wrap table{border-collapse:collapse;font-size:12px}
.preview-wrap td,.preview-wrap th{padding:4px 8px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.fatal{max-width:560px;margin:15vh auto;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
/* ==== print ==== */
@media print{
  .topbar,.sidenav,#banners,.filters,.chips-row,.bulkbar,.page-head .btn,.page-head .icon-btn,.table-foot,.cb,#toast-root{display:none!important}
  .app{display:block;height:auto}
  #main{overflow:visible;padding:0}
  .table-wrap{max-height:none;overflow:visible;border:0}
  .data th{position:static}
  body{background:#fff;color:#000}
}
</style>
</head>

<div id="drawer-root"></div>
<div id="modal-root"></div>

const fmtDate = s => { const d = parseLocal(s); return d ? F_DATE.format(d) : '—'; };
const fmtDateShort = s => { const d = parseLocal(s); if (!d) return '—'; return d.getFullYear()===new Date().getFullYear() ? F_DATE_S.format(d) : F_DATE.format(d); };
const hasTime = s => typeof s === 'string' && s.includes('T');
const fmtWhen = s => { const d = parseLocal(s); if (!d) return '—'; if (!hasTime(s)) return fmtDateShort(s); return d.getFullYear()===new Date().getFullYear() ? F_DT_S.format(d) : F_DT.format(d); };
function relDay(s){
  const d = parseLocal(s); if (!d) return '';
  const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / 864e5);
  if (Math.abs(diff) < 7) return RTF.format(diff,'day');
  if (Math.abs(diff) < 60) return RTF.format(Math.round(diff/7),'week');
  return RTF.format(Math.round(diff/30),'month');
}
function relTime(iso){
  const d = new Date(iso); const sec = (d - Date.now())/1000;
  const a = Math.abs(sec);
  if (a < 60) return 'az önce';
  if (a < 3600) return RTF.format(Math.round(sec/60),'minute');
  if (a < 86400) return RTF.format(Math.round(sec/3600),'hour');
  return relDay(d);
}
const daysBetween = (a,b) => Math.round((startOfDay(b) - startOfDay(a)) / 864e5);
function fmtMoney(n, cur){
  if (n == null || n === '' || isNaN(n)) return '';
  try { return new Intl.NumberFormat('tr-TR',{ style:'currency', currency:cur||'TRY', maximumFractionDigits:0 }).format(n); }
  catch { return new Intl.NumberFormat('tr-TR').format(n) + ' ' + (cur||''); }
}
const fmtNum = n => new Intl.NumberFormat('tr-TR').format(n);
const fmtPct = (a,b) => b ? '%' + Math.round(a/b*100) : '—';
function fmtSize(b){ if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(0) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }
function norm(s){
  return String(s ?? '').toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
}
function normKeep(s){ // uzunluğu (yaklaşık) koruyan normalize — snippet için

}
const isEditable = el => !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const pending = new Map();
function debounced(key, fn, ms=400){
  if (pending.has(key)) clearTimeout(pending.get(key).t);
  const t = setTimeout(()=>{ pending.delete(key); fn(); }, ms);
  pending.set(key, { t, fn });
}
function flushPending(){
  for (const [k, p] of pending){ clearTimeout(p.t); pending.delete(k); try { p.fn(); } catch(e){ console.error(e); } }
}
function download(name, data, type='application/octet-stream'){

  const url = URL.createObjectURL(blob);

}
function blobToBase64(blob){
  return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(',')[1] || ''); r.onerror = ()=>rej(r.error); r.readAsDataURL(blob); });
}
function base64ToBlob(b64, type){
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: type || 'application/octet-stream' });
}

}

function safeUrl(u){

  let s = String(u).trim();
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;

// ==== MODULE: db (IndexedDB) ====
const DB_NAME = 'basvuru-takip', DB_VER = 1;
const KINDS = ['applications','events','contacts','documents'];
const db = {
  _db: null, memory: false, _mem: {},
  open(){
    return new Promise((res, rej)=>{
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB yok'));
      let r;
      try { r = indexedDB.open(DB_NAME, DB_VER); } catch(e){ return rej(e); }
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const s of KINDS) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath:'id' });
        for (const s of ['blobs','kv']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s);
      };
      r.onsuccess = () => { this._db = r.result; res(); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Veritabanı başka bir sekme tarafından kilitli'));
    });
  },
  useMemory(){ this.memory = true; for (const s of [...KINDS,'blobs','kv']) this._mem[s] = new Map(); },
  _req(r){ return new Promise((res, rej)=>{ r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); },
  async getAll(s){
    if (this.memory) return [...this._mem[s].values()];
    return this._req(this._db.transaction(s).objectStore(s).getAll());
  },
  async get(s, k){
    if (this.memory) return this._mem[s].get(k);
    return this._req(this._db.transaction(s).objectStore(s).get(k));
  },
  put(s, v, k){ return this.bulk([{ store:s, type:'put', value:v, key:k }]); },
  del(s, k){ return this.bulk([{ store:s, type:'del', key:k }]); },
  bulk(ops){
    if (!ops.length) return Promise.resolve();
    if (this.memory){
      for (const o of ops){ const m = this._mem[o.store];
        if (o.type==='put') m.set(o.key !== undefined ? o.key : o.value.id, o.value);
        else if (o.type==='del') m.delete(o.key); else m.clear(); }
      return Promise.resolve();
    }
    const stores = [...new Set(ops.map(o=>o.store))];
    return new Promise((res, rej)=>{
      const t = this._db.transaction(stores, 'readwrite');
      t.oncomplete = ()=>res(); t.onerror = ()=>rej(t.error); t.onabort = ()=>rej(t.error || new Error('İşlem iptal edildi'));
      for (const o of ops){
        const os = t.objectStore(o.store);
        if (o.type==='put') o.key !== undefined ? os.put(o.value, o.key) : os.put(o.value);
        else if (o.type==='del') os.delete(o.key);
        else if (o.type==='clear') os.clear();
      }
    });
  },
};
// Şema migrasyonları: migrations[n] veriyi n -> n+1 sürümüne taşır. (obj: export formatındaki data)
const migrations = {
  // 1: data => { ...; return data; }
};
function migrateData(data, from){
  let v = from || 1;
  while (v < SCHEMA_VERSION){ if (migrations[v]) data = migrations[v](data); v++; }
  return data;
}

const S = { applications:new Map(), events:new Map(), contacts:new Map(), documents:new Map(), settings:{ ...DEFAULT_SETTINGS } };
const listeners = new Set();
let emitQueued = false;
let evIndex = null; // applicationId -> events[] (her değişiklikte sıfırlanır)
function emit(){
  evIndex = null;
  if (emitQueued) return; emitQueued = true;
  setTimeout(()=>{ emitQueued = false; listeners.forEach(f=>{ try { f(); } catch(e){ console.error(e); } }); }, 0);
}
function defaults(kind){
  switch(kind){
    case 'applications': return { company:'', position:'', status:'saved', priority:2, excitement:0, jobUrl:'', source:'', location:'', workMode:'unknown', employmentType:'full',
      salaryMin:null, salaryMax:null, salaryCurrency:S.settings.currency || 'TRY', salaryPeriod:'month', appliedAt:'', deadline:'', nextActionAt:'', nextActionNote:'',
      jobDescription:'', notes:'', tags:[], contactIds:[], documentIds:[], archived:false, statusHistory:[] };
    case 'events': return { applicationId:'', type:'interview', title:'', startAt:'', durationMin:60, location:'', notes:'', done:false, outcome:'' };
    case 'contacts': return { name:'', role:'', company:'', email:'', phone:'', linkedin:'', notes:'', lastContactAt:'' };
    case 'documents': return { name:'', kind:'cv', fileName:'', mimeType:'', size:0, version:'' };
  }

function persist(ops){
  return db.bulk(ops).catch(err=>{ console.error(err); toast('Kaydetme hatası: ' + (err && err.message || err), { error:true, timeout:8000 }); })
    .finally(()=>fileSync.schedule());
}
const store = {
  all: kind => [...S[kind].values()],
  get: (kind, id) => S[kind].get(id),
  create(kind, data){
    const t = nowISO();
    const rec = { ...defaults(kind), ...data, id: uid(), createdAt:t, updatedAt:t };
    S[kind].set(rec.id, rec);
    persist([{ store:kind, type:'put', value:rec }]); emit();
    return rec;
  },
  update(kind, id, patch){
    const r = S[kind].get(id); if (!r) return null;
    Object.assign(r, patch, { updatedAt: nowISO() });
    persist([{ store:kind, type:'put', value:r }]); emit();
    return r;
  },
  putMany(kind, recs){
    for (const r of recs) S[kind].set(r.id, r);
    persist(recs.map(r=>({ store:kind, type:'put', value:r }))); emit();
  },
  removeMany(kind, ids){
    const ops = [];
    for (const id of ids){ S[kind].delete(id); ops.push({ store:kind, type:'del', key:id }); if (kind==='documents') ops.push({ store:'blobs', type:'del', key:id }); }
    persist(ops); emit();
  },
};
function setSetting(k, v){
  S.settings[k] = v;
  db.put('kv', { ...S.settings }, 'settings').catch(console.error);
  emit();
}
function createApplication(data){
  const status = data.status || 'saved';
  const t = nowISO();
  const extra = { statusHistory:[{ status, at:t }] };
  if (stageOf(status) >= 1 && !data.appliedAt) extra.appliedAt = todayStr();
  return store.create('applications', { ...data, ...extra, status });
}
function setStatus(id, status){
  const a = store.get('applications', id);
  if (!a || a.status === status) return;
  const patch = { status, statusHistory:[...(a.statusHistory||[]), { status, at:nowISO() }] };
  if (stageOf(status) >= 1 && !a.appliedAt) patch.appliedAt = todayStr();
  store.update('applications', id, patch);
}
function setStatusMany(ids, status){
  const t = nowISO(); const recs = [];
  for (const id of ids){
    const a = store.get('applications', id); if (!a || a.status === status) continue;
    a.status = status; a.statusHistory = [...(a.statusHistory||[]), { status, at:t }];
    if (stageOf(status) >= 1 && !a.appliedAt) a.appliedAt = todayStr();
    a.updatedAt = t; recs.push(a);
  }
  if (recs.length) store.putMany('applications', recs);
  return recs.length;
}
function patchMany(ids, fn){
  const t = nowISO(); const recs = [];
  for (const id of ids){ const a = store.get('applications', id); if (!a) continue; fn(a); a.updatedAt = t; recs.push(a); }
  if (recs.length) store.putMany('applications', recs);
}
// Silme + geri al
async function removeApplications(ids){
  const apps = ids.map(id=>store.get('applications', id)).filter(Boolean).map(a=>structuredClone(a));
  const evs = store.all('events').filter(e=>ids.includes(e.applicationId)).map(e=>structuredClone(e));
  store.removeMany('events', evs.map(e=>e.id));
  store.removeMany('applications', apps.map(a=>a.id));
  if (drawerState.id && ids.includes(drawerState.id)) closeApp();
  toast(apps.length === 1 ? `“${apps[0].company}” silindi` : `${apps.length} başvuru silindi`, {
    timeout:6000, action:{ label:'Geri al', fn:()=>{ store.putMany('applications', apps); store.putMany('events', evs); toast('Geri alındı'); } } });
}
function removeWithUndo(kind, id, label){
  const rec = structuredClone(store.get(kind, id)); if (!rec) return;
  let blobP = kind === 'documents' ? db.get('blobs', id) : null;
  Promise.resolve(blobP).then(blob=>{
    store.removeMany(kind, [id]);
    toast(`${label} silindi`, { timeout:6000, action:{ label:'Geri al', fn:()=>{
      store.putMany(kind, [rec]);
      if (blob) persist([{ store:'blobs', type:'put', value:blob, key:id }]);
    } } });
  });
}
const appContacts = a => (a.contactIds||[]).map(id=>S.contacts.get(id)).filter(Boolean);
const appDocs = a => (a.documentIds||[]).map(id=>S.documents.get(id)).filter(Boolean);
function appEvents(a){
  if (!evIndex){ evIndex = new Map(); for (const e of S.events.values()){ if (!evIndex.has(e.applicationId)) evIndex.set(e.applicationId, []); evIndex.get(e.applicationId).push(e); } }

const lastStatusAt = a => { const h_ = a.statusHistory || []; return h_.length ? h_[h_.length-1].at : a.createdAt; };
const allTags = () => { const m = new Map(); for (const a of S.applications.values()) for (const t of a.tags||[]) m.set(norm(t), t); return [...m.values()].sort((x,y)=>x.localeCompare(y,'tr')); };
const distinctValues = key => { const m = new Map(); for (const a of S.applications.values()) if (a[key]) m.set(norm(a[key]), a[key]); return [...m.values()].sort((x,y)=>x.localeCompare(y,'tr')); };

// ==== MODULE: sync (yedek, dosya bağlantısı, içe/dışa aktarma) ====
async function buildExport(includeDocs){
  const docs = [];
  for (const d of S.documents.values()){
    const o = { ...d };
    if (includeDocs){ const b = await db.get('blobs', d.id); if (b) o.data = await blobToBase64(b); }
    docs.push(o);
  }
  const { lastBackupAt, ...settings } = S.settings;
  return JSON.stringify({ app:'basvuru-takip', schemaVersion:SCHEMA_VERSION, version:VERSION, exportedAt:nowISO(),
    data:{ applications:store.all('applications'), events:store.all('events'), contacts:store.all('contacts'), documents:docs, settings } });
}
function markBackup(){ setSetting('lastBackupAt', nowISO()); }
async function exportJSON(){
  try {
    const json = await buildExport(S.settings.includeDocs);
    download(`basvuru-takip-yedek-${todayStr()}.json`, json, 'application/json');
    markBackup(); toast('Yedek indirildi');
  } catch(e){ console.error(e); toast('Yedek oluşturulamadı: ' + e.message, { error:true }); }
}
async function importJSONText(text, mode){
  let obj;
  try { obj = JSON.parse(text); } catch { throw new Error('Dosya geçerli bir JSON değil.'); }
  if (!obj || obj.app !== 'basvuru-takip' || !obj.data) throw new Error('Bu dosya bir Başvuru Takip yedeği değil.');
  if ((obj.schemaVersion||1) > SCHEMA_VERSION) throw new Error('Bu yedek daha yeni bir uygulama sürümüyle oluşturulmuş.');
  const data = migrateData(obj.data, obj.schemaVersion);
  const ops = []; let added = 0, updated = 0, skipped = 0;
  if (mode === 'replace'){
    for (const k of [...KINDS, 'blobs']) ops.push({ store:k, type:'clear' });
    KINDS.forEach(k=>S[k].clear());
  }
  for (const kind of KINDS){
    for (const rec of (data[kind] || [])){
      if (!rec || typeof rec !== 'object' || !rec.id) continue;
      const cur = S[kind].get(rec.id);
      if (cur && (cur.updatedAt||'') >= (rec.updatedAt||'')){ skipped++; continue; }
      const r = { ...defaults(kind), ...rec };
      if (kind === 'documents'){
        const b64 = r.data; delete r.data;
        if (b64) { try { ops.push({ store:'blobs', type:'put', value:base64ToBlob(b64, r.mimeType), key:r.id }); } catch { /* bozuk belge verisi */ } }
      }
      S[kind].set(r.id, r); ops.push({ store:kind, type:'put', value:r });
      cur ? updated++ : added++;
    }
  }
  if (mode === 'replace' && data.settings && typeof data.settings === 'object'){
    Object.assign(S.settings, DEFAULT_SETTINGS, data.settings, { lastBackupAt:S.settings.lastBackupAt });
    ops.push({ store:'kv', type:'put', value:{ ...S.settings }, key:'settings' });
    applyTheme();
  }
  await db.bulk(ops);
  emit(); fileSync.schedule();
  return { added, updated, skipped };
}
const fileSync = {
  supported: typeof window.showSaveFilePicker === 'function',
  handle: null, status: 'none', timer: null, lastWrite: null, writing: false, again: false,
  async init(){
    if (!this.supported || db.memory) { this.status = this.supported ? 'none' : 'unsupported'; return; }
    try {
      const hd = await db.get('kv', 'fileHandle');
      if (!hd) return;
      this.handle = hd;
      const p = await hd.queryPermission({ mode:'readwrite' });
      this.status = p === 'granted' ? 'ok' : 'needs-permission';
    } catch(e){ console.warn(e); this.status = 'none'; }
  },
  async link(){
    try {
      const hd = await window.showSaveFilePicker({ suggestedName:'basvuru-takip-veri.json', types:[{ description:'JSON', accept:{ 'application/json':['.json'] } }] });
      this.handle = hd; await db.put('kv', hd, 'fileHandle');
      this.status = 'ok'; await this.writeNow();
      toast('Veri dosyasına bağlandı. Değişiklikler otomatik yazılacak.');
    } catch(e){ if (e.name !== 'AbortError') toast('Dosyaya bağlanılamadı: ' + e.message, { error:true }); }
    renderChrome(); rerenderIf('settings');
  },
  async relink(){
    if (!this.handle) return this.link();
    try {
      const p = await this.handle.requestPermission({ mode:'readwrite' });
      this.status = p === 'granted' ? 'ok' : 'needs-permission';
      if (this.status === 'ok') await this.writeNow();
    } catch(e){ this.status = 'error'; toast('İzin alınamadı: ' + e.message, { error:true }); }
    renderChrome(); rerenderIf('settings');
  },
  async unlink(){
    this.handle = null; this.status = 'none'; clearTimeout(this.timer);
    await db.del('kv', 'fileHandle').catch(()=>{});
    renderChrome(); rerenderIf('settings');
  },
  schedule(){
    if (this.status !== 'ok') return;
    clearTimeout(this.timer); this.timer = setTimeout(()=>this.writeNow(), 2000);
  },
  async writeNow(){
    if (!this.handle || this.status !== 'ok') return;
    if (this.writing){ this.again = true; return; }
    this.writing = true;
    try {
      const json = await buildExport(S.settings.includeDocs);
      const w = await this.handle.createWritable(); await w.write(json); await w.close();
      this.lastWrite = Date.now(); S.settings.lastBackupAt = nowISO();
      db.put('kv', { ...S.settings }, 'settings').catch(console.error);
    } catch(e){ console.error(e); this.status = e.name === 'NotAllowedError' ? 'needs-permission' : 'error'; }
    this.writing = false;
    renderChrome();
    if (this.again){ this.again = false; this.schedule(); }
  },
};

const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function trapFocus(e, box){
  const els = $$(FOCUSABLE, box).filter(el=>el.offsetParent !== null || el === document.activeElement);
  if (!els.length) return;
  const first = els[0], last = els[els.length-1];
  if (e.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function toast(msg, { action, timeout=3500, error=false } = {}){
  const root = $('#toast-root');
  let t;
  const close = () => { clearTimeout(t); el.remove(); };
  const el = h('div', { class:'toast' + (error ? ' error' : ''), role: error ? 'alert' : 'status' },
    h('span', { class:'grow' }, msg),
    action && h('button', { class:'btn sm', onClick:()=>{ close(); action.fn(); } }, action.label),
    h('button', { class:'icon-btn sm', style:'color:inherit', 'aria-label':'Kapat', onClick:close }, icon('x',14)));
  root.append(el);
  while (root.children.length > 4) root.firstChild.remove();
  t = setTimeout(close, timeout);
  return close;
}
const modalStack = [];
function modal({ title, body, footer, wide=false, onClose, initialFocus }){
  const prev = document.activeElement;
  const tid = 'm-' + uid();
  let closed = false;
  const close = () => {
    if (closed) return; closed = true; back.remove();
    modalStack.splice(modalStack.indexOf(api), 1);
    onClose && onClose();
    if (prev && document.contains(prev)) prev.focus();
  };
  const box = h('div', { class:'modal' + (wide ? ' wide' : ''), role:'dialog', 'aria-modal':'true', 'aria-labelledby':tid, tabindex:'-1' },
    h('div', { class:'modal-head' }, h('h2', { id:tid }, title), h('button', { class:'icon-btn', 'aria-label':'Kapat', onClick:close }, icon('x'))),
    h('div', { class:'modal-body' }, body),
    footer && h('div', { class:'modal-foot' }, typeof footer === 'function' ? footer(close) : footer));
  const back = h('div', { class:'modal-back', onMousedown:e=>{ if (e.target === back) close(); } }, box);
  back.addEventListener('keydown', e=>{
    if (e.key === 'Escape'){ e.stopPropagation(); e.preventDefault(); close(); }
    else if (e.key === 'Tab') trapFocus(e, box);
  });
  $('#modal-root').append(back);
  const api = { close, box, body: box.querySelector('.modal-body') };
  modalStack.push(api);
  const f = (initialFocus && box.querySelector(initialFocus)) || box.querySelector('[data-autofocus]') || box.querySelector('.modal-body ' + FOCUSABLE) || box;
  setTimeout(()=>f.focus(), 0);
  return api;
}
function confirmDialog(message, { title='Emin misiniz?', ok='Onayla', danger=false, detail } = {}){
  return new Promise(res=>{
    let result = false;
    const m = modal({ title, body: h('div', { class:'stack' }, h('p', { style:'margin:0' }, message), detail && h('p', { class:'muted small', style:'margin:0' }, detail)),
      footer: close => [
        h('button', { class:'btn', onClick:close }, 'Vazgeç'),
        h('button', { class:'btn ' + (danger ? 'danger solid' : 'primary'), 'data-autofocus':true, onClick:()=>{ result = true; close(); } }, ok) ],
      onClose: ()=>res(result) });

function todayItems(){
  const now = new Date(), eod = endOfDay(now), sod = startOfDay(now), in24 = new Date(+now + 864e5);
  const items = [];
  for (const a of S.applications.values()){
    if (a.archived || isClosed(a.status) || a.status === 'accepted') continue;
    if (a.nextActionAt){ const d = parseLocal(a.nextActionAt); if (d && d <= eod) items.push({ kind:'action', date:d, app:a, overdue: hasTime(a.nextActionAt) ? d < now : d < sod, label: a.nextActionNote || 'Takip et' }); }
    if (a.deadline && a.status === 'saved'){ const d = parseLocal(a.deadline); if (d && d <= endOfDay(addDays(now, 2)) && d >= addDays(sod, -3)) items.push({ kind:'deadline', date:d, app:a, overdue: d < sod, label:'Son başvuru tarihi' }); }
  }
  for (const e of S.events.values()){
    if (e.done || !e.startAt) continue;
    const d = parseLocal(e.startAt); const a = S.applications.get(e.applicationId);
    if (d && d >= sod && d <= in24) items.push({ kind:'event', date:d, app:a, ev:e, overdue:false, label: (EVENT_TYPES[e.type]||'') + (e.title ? ': ' + e.title : '') });
  }
  items.sort((x,y)=>x.date - y.date);
  const stale = [];
  const gd = Number(S.settings.ghostDays) || 21;
  for (const a of S.applications.values()){
    if (a.archived || a.status !== 'applied') continue;
    const since = daysBetween(new Date(lastStatusAt(a)), now);
    const lastEv = appEvents(a).reduce((m,e)=>Math.max(m, +new Date(e.updatedAt||0)), 0);
    if (since >= gd && (!lastEv || daysBetween(new Date(lastEv), now) >= gd) && !a.nextActionAt) stale.push({ app:a, days:since });
  }
  stale.sort((x,y)=>y.days - x.days);
  return { items, stale };
}

async function addFiles(files, { linkTo } = {}){

    const d = store.create('documents', { name:file.name.replace(/\.[^.]+$/, ''), kind, fileName:file.name, mimeType:file.type || 'application/octet-stream', size:file.size, version:'' });
    await persist([{ store:'blobs', type:'put', value:file.slice(0, file.size, file.type), key:d.id }]);

function icsDate(d){ return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
const icsDay = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const icsEsc = s => String(s || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){
  const enc = new TextEncoder(); const out = []; let cur = '', bytes = 0;
  for (const ch of line){
    const b = enc.encode(ch).length;
    if (bytes + b > (out.length ? 74 : 75)){ out.push(cur); cur = ''; bytes = 0; }
    cur += ch; bytes += b;
  }
  out.push(cur);
  return out.join('\r\n ');
}
function buildICS(items){
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Basvuru Takip//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Başvuru Takip'];
  const stamp = icsDate(new Date());
  for (const it of items){
    L.push('BEGIN:VEVENT', 'UID:' + it.uid + '@basvuru-takip.local', 'DTSTAMP:' + stamp);
    if (it.allDay){ L.push('DTSTART;VALUE=DATE:' + icsDay(it.date), 'DTEND;VALUE=DATE:' + icsDay(addDays(it.date, 1))); }
    else { L.push('DTSTART:' + icsDate(it.date), 'DTEND:' + icsDate(new Date(+it.date + (it.durationMin || 30) * 60e3))); }
    L.push('SUMMARY:' + icsEsc(it.title));
    if (it.location) L.push('LOCATION:' + icsEsc(it.location));
    if (it.description) L.push('DESCRIPTION:' + icsEsc(it.description));
    if (!it.allDay) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:' + icsEsc(it.title),'TRIGGER:-PT30M','END:VALARM');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

// ==== MODULE: CSV ====
const CSV_FIELDS = [
  ['company','Şirket'], ['position','Pozisyon'], ['status','Durum'], ['priority','Öncelik'], ['excitement','İlgi (0-5)'], ['location','Konum'],
  ['workMode','Çalışma şekli'], ['employmentType','İstihdam türü'], ['source','Kaynak'], ['jobUrl','İlan linki'], ['salaryMin','Maaş (en az)'], ['salaryMax','Maaş (en çok)'],
  ['salaryCurrency','Para birimi'], ['salaryPeriod','Maaş periyodu'], ['appliedAt','Başvuru tarihi'], ['deadline','Son başvuru tarihi'], ['nextActionAt','Sonraki aksiyon'],
  ['nextActionNote','Sonraki aksiyon notu'], ['tags','Etiketler'], ['notes','Notlar'], ['jobDescription','İlan metni'], ['archived','Arşivde'], ['createdAt','Oluşturulma'],
];
const CSV_SYNONYMS = { company:['firma','sirket','company','isveren','employer','kurum'], position:['pozisyon','title','unvan','rol','role','job','is','position','job title'],
  status:['durum','status','asama','stage'], jobUrl:['url','link','ilan','ilan linki','job url'], appliedAt:['basvuru tarihi','applied','date applied','tarih','applied at','date'],
  location:['konum','lokasyon','sehir','location','city'], source:['kaynak','source','platform','nereden'], notes:['not','notlar','notes','aciklama'], tags:['etiket','etiketler','tags'] };
function csvCell(v, delim){
  let s = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+([.,]\d+)?$/.test(s)) s = "'" + s; // formül enjeksiyonuna karşı
  return /["\r\n]/.test(s) || s.includes(delim) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function csvValue(a, k){
  switch(k){
    case 'status': return (STATUS[a.status] || STATUS.saved).label;
    case 'priority': return PRIORITIES[a.priority] || '';
    case 'workMode': return WORK_MODES[a.workMode] || '';
    case 'employmentType': return EMP_TYPES[a.employmentType] || '';
    case 'salaryPeriod': return PERIODS[a.salaryPeriod] || '';
    case 'tags': return (a.tags || []).join(', ');
    case 'archived': return a.archived ? 'Evet' : '';
    case 'createdAt': return (a.createdAt || '').slice(0,10);
    case 'nextActionAt': return (a.nextActionAt || '').replace('T',' ');
    default: return a[k] == null ? '' : a[k];
  }
}
function exportCSV(apps = store.all('applications')){
  if (!apps.length) return toast('Dışa aktarılacak başvuru yok.');
  const d = S.settings.csvDelimiter === ',' ? ',' : ';';
  const lines = [CSV_FIELDS.map(f=>csvCell(f[1], d)).join(d), ...apps.map(a=>CSV_FIELDS.map(([k])=>csvCell(csvValue(a, k), d)).join(d))];
  download(`basvurular-${todayStr()}.csv`, '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast(`${apps.length} başvuru CSV olarak indirildi`);
}
function parseCSV(text){
  text = text.replace(/^\ufeff/, '');
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const count = ch => { let n = 0, q = false; for (const c of firstLine){ if (c === '"') q = !q; else if (!q && c === ch) n++; } return n; };
  const delim = [';', ',', '\t'].sort((a,b)=>count(b) - count(a))[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim){ row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim() !== ''));
}
function enumFrom(map, text){
  const n = norm(text); if (!n) return null;
  for (const [k, l] of Object.entries(map)) if (norm(k) === n || norm(l) === n) return k;
  return null;
}
function statusFrom(text){
  const n = norm(text); if (!n) return null;
  const s = STATUSES.find(s=>norm(s.id) === n || norm(s.label) === n);
  if (s) return s.id;
  const syn = { wishlist:'saved', kaydedildi:'saved', saved:'saved', applied:'applied', basvuruldu:'applied', basvurdum:'applied', screening:'screen', 'phone screen':'screen', interview:'interview', mulakat:'interview',
    offer:'offer', teklif:'offer', accepted:'accepted', kabul:'accepted', rejected:'rejected', red:'rejected', ret:'rejected', reddedildi:'rejected', withdrawn:'withdrawn', ghosted:'ghosted', 'no response':'ghosted', 'yanit yok':'ghosted' };
  return syn[n] || null;
}
function dateFrom(text, withTime){
  const s = String(text || '').trim().replace(/^'/, ''); if (!s) return '';
  let m;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/.exec(s))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}` + (withTime && m[4] ? `T${pad(m[4])}:${m[5]}` : '');
  if ((m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(s))){ const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}` + (withTime && m[4] ? `T${pad(m[4])}:${m[5]}` : ''); }
  const d = new Date(s); return isNaN(d) ? '' : (withTime ? ymdhm(d) : ymd(d));
}
function numFrom(text){ const s = String(text || '').replace(/[^\d.,-]/g,''); if (!s) return null; const n = Number(s.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',', '.')); return isNaN(n) ? null : n; }
function csvToApp(get){
  const strip = v => String(v ?? '').trim().replace(/^'(?=[=+\-@\t\r])/, '');
  const a = {};
  a.company = strip(get('company')); a.position = strip(get('position'));
  a.status = statusFrom(get('status')) || 'saved';
  const pr = get('priority'); a.priority = Number(enumFrom(PRIORITIES, pr)) || (/^[123]$/.test(strip(pr)) ? Number(strip(pr)) : 2);
  const ex = numFrom(get('excitement')); a.excitement = ex == null ? 0 : clamp(Math.round(ex), 0, 5);
  for (const k of ['location','source','jobUrl','nextActionNote','notes','jobDescription']) a[k] = strip(get(k));
  a.workMode = enumFrom(WORK_MODES, get('workMode')) || (/(remote|uzaktan)/i.test(get('workMode')||'') ? 'remote' : 'unknown');
  a.employmentType = enumFrom(EMP_TYPES, get('employmentType')) || 'full';
  a.salaryMin = numFrom(get('salaryMin')); a.salaryMax = numFrom(get('salaryMax'));
  const cur = strip(get('salaryCurrency')).toUpperCase(); a.salaryCurrency = /^[A-Z]{3}$/.test(cur) ? cur : (S.settings.currency || 'TRY');
  a.salaryPeriod = enumFrom(PERIODS, get('salaryPeriod')) || (/(year|yil)/i.test(norm(get('salaryPeriod'))) ? 'year' : 'month');
  a.appliedAt = dateFrom(get('appliedAt')); a.deadline = dateFrom(get('deadline')); a.nextActionAt = dateFrom(get('nextActionAt'), true);
  a.tags = strip(get('tags')).split(/[,|;]/).map(s=>s.trim()).filter(Boolean);
  a.archived = /^(evet|yes|true|1|x)$/i.test(strip(get('archived')));
  const created = dateFrom(get('createdAt'));
  return { a, created };
}
async function importCSVFlow(){
  const [file] = await pickFile('.csv,text/csv,text/plain');
  if (!file) return;
  let rows;
  try { rows = parseCSV(await readFileText(file)); } catch(e){ return toast('CSV okunamadı: ' + e.message, { error:true }); }
  if (rows.length < 2) return toast('CSV dosyasında başlık satırı ve en az bir veri satırı olmalı.', { error:true });
  const headers = rows[0].map(s=>s.trim()); const data = rows.slice(1);
  const guess = hd => {
    const n = norm(hd);
    for (const [k, l] of CSV_FIELDS) if (norm(l) === n || norm(k) === n) return k;
    for (const [k, syn] of Object.entries(CSV_SYNONYMS)) if (syn.includes(n)) return k;
    for (const [k, syn] of Object.entries(CSV_SYNONYMS)) if (syn.some(s=>s.length > 3 && n.includes(s))) return k;
    return '';
  };
  const used = new Set();
  const sels = headers.map(hd=>{ let g = guess(hd); if (used.has(g)) g = ''; if (g) used.add(g); return selectEl([['', '— Yoksay —'], ...CSV_FIELDS], g, { class:'input sm', 'aria-label': hd + ' sütununun eşleneceği alan' }); });

      const at = a.appliedAt ? new Date(parseLocal(a.appliedAt)).toISOString() : (created ? new Date(parseLocal(created)).toISOString() : t);

    }
    store.putMany('applications', recs);

  };

      h('p', { class:'muted small', style:'margin:0' }, `${file.name}: ${data.length} satır bulundu. Her CSV sütununu uygulamadaki bir alana eşleyin. Durum, öncelik ve çalışma şekli değerleri metinden otomatik tanınır; tarihler YYYY-AA-GG veya GG.AA.YYYY olabilir.`),
      h('table', { class:'map-table' }, h('thead', null, h('tr', null, h('th', null, 'CSV sütunu'), h('th', null, 'Örnek'), h('th', null, 'Alan'))),
        h('tbody', null, headers.map((hd, i)=>h('tr', null, h('td', null, h('strong', null, hd || `(Sütun ${i+1})`)), h('td', { class:'muted ellipsis', style:'max-width:220px' }, (data.find(r=>r[i]) || [])[i] || ''), h('td', null, sels[i]))))),

      err),
    footer: close => [h('button', { class:'btn', onClick:close }, 'Vazgeç'), h('button', { class:'btn primary', onClick:doImport }, `${data.length} satırı içe aktar`)] });

function computeStats(){
  const apps = store.all('applications');
  const maxStage = a => Math.max(stageOf(a.status), ...(a.statusHistory||[]).map(s=>stageOf(s.status)));
  const wasRejected = a => a.status === 'rejected' || (a.statusHistory||[]).some(s=>s.status === 'rejected');
  const applied = apps.filter(a=>maxStage(a) >= 1 || a.appliedAt);
  const responded = applied.filter(a=>maxStage(a) >= 2 || wasRejected(a));
  const reached = ACTIVE_STATUSES.map(s=>({ s, n: s.stage === 0 ? apps.length : apps.filter(a=>maxStage(a) >= s.stage || (s.stage === 1 && a.appliedAt)).length }));
  const respTimes = [];
  for (const a of responded){
    const hist = (a.statusHistory || []).map(x=>({ ...x, d:new Date(x.at) }));
    const ap = a.appliedAt ? parseLocal(a.appliedAt) : (hist.find(x=>stageOf(x.status) >= 1) || {}).d;
    const r = hist.find(x=>(stageOf(x.status) >= 2 || x.status === 'rejected') && (!ap || x.d >= startOfDay(ap)));
    if (ap && r) respTimes.push(Math.max(0, daysBetween(ap, r.d)));
  }
  respTimes.sort((x,y)=>x-y);
  const avg = respTimes.length ? respTimes.reduce((s,x)=>s+x, 0) / respTimes.length : null;
  const median = respTimes.length ? respTimes[Math.floor(respTimes.length/2)] : null;
  const wk0 = startOfWeek(new Date());
  const weeks = Array.from({ length:12 }, (_, i)=>({ start:addDays(wk0, -7*(11-i)), n:0 }));
  for (const a of applied){
    const d = a.appliedAt ? parseLocal(a.appliedAt) : null; if (!d) continue;
    const idx = 11 - Math.floor(daysBetween(startOfWeek(d), wk0) / 7);
    if (idx >= 0 && idx < 12) weeks[idx].n++;
  }
  const srcMap = new Map();
  for (const a of applied){ const k = a.source ? a.source.trim() : '(belirtilmemiş)'; const key = norm(k); if (!srcMap.has(key)) srcMap.set(key, { label:k, n:0, r:0, i:0 }); const o = srcMap.get(key); o.n++; if (responded.includes(a)) o.r++; if (maxStage(a) >= 3) o.i++; }
  const sources = [...srcMap.values()].sort((x,y)=>y.n - x.n);
  const current = STATUSES.map(s=>({ s, n: apps.filter(a=>!a.archived && a.status === s.id).length }));
  const thisWeek = applied.filter(a=>a.appliedAt && parseLocal(a.appliedAt) >= wk0).length;
  const active = apps.filter(a=>!a.archived && !isClosed(a.status) && a.status !== 'accepted').length;
  return { apps, applied, responded, reached, interviews: apps.filter(a=>maxStage(a) >= 3).length, offers: apps.filter(a=>maxStage(a) >= 4).length, avg, median, respTimes, weeks, sources, current, thisWeek, active };
}

    return { a, fields:[['company', a.company], ['position', a.position], ['tags', (a.tags||[]).join(' ')], ['location', a.location], ['source', a.source], ['contacts', cs], ['notes', a.notes], ['jd', a.jobDescription]].map(([k,v])=>[k, v || '', normKeep(v || '')]) };
  });

    const i = ntext.indexOf(q); if (i < 0) return null;

    return [s > 0 ? '…' : '', text.slice(s, i), h('mark', null, text.slice(i, i + q.length)), text.slice(i + q.length, e), e < text.length ? '…' : ''];

      const recent = store.all('applications').sort((x,y)=>(y.updatedAt||'').localeCompare(x.updatedAt||'')).slice(0, 8);
      items = recent.map(a=>({ type:'app', a, snip:null, recent:true }));
    } else {
      const words = q.split(/\s+/).filter(Boolean);
      for (const it of idxCache){
        const all = it.fields.map(f=>f[2]).join(' ');
        if (!words.every(w=>all.includes(w))) continue;
        let score = 0, snip = null;
        for (const [k, v, nv] of it.fields){
          if (nv.includes(words[0])){ score += k === 'company' ? 10 : k === 'position' ? 6 : k === 'tags' ? 4 : 1; if (!snip && !['company','position'].includes(k)) snip = snippet(v.replace(/\s+/g,' '), normKeep(v.replace(/\s+/g,' ')), words[0]); }
        }
        if (normKeep(it.a.company).startsWith(words[0])) score += 5;
        items.push({ type:'app', a:it.a, snip, score: score + (it.a.archived ? -3 : 0) });
      }
      items.sort((x,y)=>y.score - x.score);
      items = items.slice(0, 30);
      for (const c of contacts) if (words.every(w=>c.hay.includes(w))) items.push({ type:'contact', c:c.c });
    }
    idx = 0; draw();
  };
  const draw = () => {
    results.replaceChildren(
      !inp.value.trim() && items.length ? h('div', { class:'menu-label' }, 'Son güncellenenler') : null,
      ...items.slice(0, 40).map((it, i)=>{
        const sel = i === idx;
        if (it.type === 'contact') return h('button', { class:'result', role:'option', id:'sr-' + i, 'aria-selected':String(sel), onClick:()=>pick(i) },
          h('div', null, icon('users', 14), ' ', h('strong', null, it.c.name), h('span', { class:'muted' }, [it.c.role, it.c.company].filter(Boolean).length ? ' · ' + [it.c.role, it.c.company].filter(Boolean).join(', ') : '')));
        const st = STATUS[it.a.status] || STATUS.saved;
        return h('button', { class:'result', role:'option', id:'sr-' + i, 'aria-selected':String(sel), onClick:()=>pick(i) },
          h('div', { class:'row', style:'gap:8px;flex-wrap:nowrap' }, h('span', { class:'dot', style:`background:${st.color}` }), h('span', { class:'ellipsis' }, h('strong', null, it.a.company), ' — ', it.a.position),
            h('span', { class:'muted small right nowrap' }, st.label + (it.a.archived ? ' · arşiv' : ''))),
          it.snip && h('div', { class:'snip' }, it.snip));
      }),
      inp.value.trim() && !items.length ? h('p', { class:'muted', style:'padding:8px' }, 'Sonuç yok.') : null);
    inp.setAttribute('aria-activedescendant', items.length ? 'sr-' + idx : '');
    const el = $('#sr-' + idx, results); el && el.scrollIntoView({ block:'nearest' });
  };

  inp.addEventListener('input', run);
  inp.addEventListener('keydown', e=>{
    if (e.key === 'ArrowDown'){ e.preventDefault(); idx = Math.min(items.length - 1, idx + 1); draw(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); idx = Math.max(0, idx - 1); draw(); }
    else if (e.key === 'Enter'){ e.preventDefault(); pick(idx); }
  });
  const m = modal({ title:'Ara', wide:true, body: h('div', null, inp, results) });
  run();
}

async function generateFake(){
  if (!(await confirmDialog('1000 sahte başvuru eklenecek (etiket: test-verisi).', { ok:'Üret' }))) return;
  const cs = ['Arı','Bulut','Çınar','Delta','Ege','Fırat','Galata','Hazar','İris','Jade','Kule','Liman','Marmara','Nova','Orkide','Pera','Rota','Sarp','Toros','Uzay','Vadi','Yakamoz','Zirve'];
  const sf = ['Yazılım','Teknoloji','Bilişim','Fintech','Lojistik','Holding','Dijital','Labs','Sistem'];
  const ps = ['Backend Developer','Frontend Developer','Full Stack Developer','DevOps Engineer','Data Engineer','QA Engineer','Mobile Developer','Product Manager','UX Designer','SRE'];
  const lv = ['Junior ','','Kıdemli ','Lead '];
  const src = ['LinkedIn','Kariyer.net','Indeed','Referans','Şirket sitesi','Yenibiris'];
  const loc = ['İstanbul','Ankara','İzmir','Uzaktan','Bursa','Antalya'];
  const R = arr => arr[Math.floor(Math.random()*arr.length)];
  const t = nowISO(); const recs = [];
  for (let i=0;i<1000;i++){
    const ago = Math.floor(Math.random()*150) + 1;
    const path = [['saved', ago + 3], ['applied', ago]];
    const r = Math.random();
    if (r > .35) path.push([r > .85 ? 'rejected' : 'screen', Math.max(0, ago - 5)]);
    if (r > .6 && r <= .85) path.push(['interview', Math.max(0, ago - 12)]);
    if (r > .75 && r <= .85) path.push(['offer', Math.max(0, ago - 20)]);
    if (r < .2 && ago > 30) path.push(['ghosted', ago - 25]);
    const hist = histFrom(path.filter(p=>p[1] >= 0));
    recs.push({ ...defaults('applications'), id:uid(), createdAt:hist[0].at, updatedAt:t, company: R(cs) + ' ' + R(sf), position: R(lv) + R(ps), source:R(src), location:R(loc),
      workMode:R(['office','hybrid','remote','unknown']), priority:R([1,2,2,3]), appliedAt: ymd(addDays(new Date(), -ago)), statusHistory:hist, status:hist[hist.length-1].status,
      tags:['test-verisi'], notes:'Otomatik üretilmiş test kaydı #' + (i+1) });
  }
  const t0 = performance.now();
  store.putMany('applications', recs);
  toast(`1000 kayıt eklendi (${Math.round(performance.now() - t0)} ms)`);
}

async function main(){
  try { await db.open(); }
  catch(e){ console.warn('IndexedDB kullanılamıyor, bellek modunda çalışılıyor:', e); db.useMemory(); }
  try {
    const settings = await db.get('kv', 'settings');
    if (settings) Object.assign(S.settings, settings);
    for (const k of KINDS){ const rows = await db.getAll(k); for (const r of rows) S[k].set(r.id, { ...defaults(k), ...r }); }
    const sv = await db.get('kv', 'schemaVersion');
    if (!sv) db.put('kv', SCHEMA_VERSION, 'schemaVersion').catch(()=>{});
  } catch(e){
    console.error(e);
    $('#app').replaceChildren(h('div', { class:'fatal' }, h('h2', null, 'Veriler yüklenemedi'), h('p', null, String(e && e.message || e)), h('p', { class:'muted' }, 'Sayfayı yenilemeyi deneyin. Sorun sürerse başka bir tarayıcı kullanın ve yedeğinizi içe aktarın.')));
    return;
  }
  applyTheme();
  await fileSync.init();
  if (navigator.storage && navigator.storage.persist && !db.memory) navigator.storage.persisted().then(p=>{ if (!p) navigator.storage.persist().catch(()=>{}); }).catch(()=>{});
  buildChrome();
  onRoute();
  checkReminders();
  setInterval(checkReminders, 60000);
}
